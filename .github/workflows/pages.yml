name: Deploy Pages

on:
  push:
    branches: [main, fermilab-2026-09-11]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (site root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - name: Checkout Fermilab cut (/fermilab)
        uses: actions/checkout@v4
        with:
          ref: fermilab-2026-09-11
          path: site/fermilab
      - name: Drop git metadata
        run: rm -rf site/.git site/fermilab/.git
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
